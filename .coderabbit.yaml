# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for poli-page repos. PRs here are mostly opened and fixed by automated agents
# (the poli-page auto loop and issue pipeline), which read CodeRabbit's findings and its commit status.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  allow_author_approval: true
  # The summary goes in the walkthrough, never in the PR description: the merge gate reads the description.
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: false
  # The loop decides "reviewed this head" from the CodeRabbit commit status ("Review completed").
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  # PR labels are the closed issues' labels; CodeRabbit only suggests.
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    include_all_authors: false
  auto_review:
    enabled: true
    drafts: false
    # Every push of a fix round must be reviewed, and never auto-paused (the loop allows up to 5 rounds).
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!**/composer.lock"
    - "!**/vendor/**"
    - "!**/.phpunit.cache/**"
    - "!**/.phpunit.result.cache"
    - "!**/.phpstan.cache/**"
    - "!**/.php-cs-fixer.cache"
    - "!**/coverage/**"
    - "!**/storage/framework/**"
    - "!**/node_modules/**"
  path_instructions:
    - path: "src/**/*.php"
      instructions: >-
        This is a Laravel package wrapping the poli-page PHP SDK. Keep the public surface (service
        provider bindings, PoliPage facade, PoliPageResponseFactory, poli-page:render command, events)
        stable and consistent with the other poli-page SDKs and integrations; no breaking changes
        without a major version bump and a CHANGELOG entry. Use idiomatic Laravel (container
        singletons, config(), event dispatcher, auto-discovery). Surface API errors in the
        { error: CODE_STRING, detail?, issues? } (flat, API spec §4.1) shape from the SDK, never swallow them.
    - path: "config/**/*.php"
      instructions: >-
        The API key and base URL come from env vars (POLI_PAGE_API_KEY etc.), never hardcoded. Defaults
        must be safe and documented, and config validation must reject invalid values clearly.
    - path: "tests/**/*.php"
      instructions: >-
        Every public method and config option needs a unit test (Orchestra Testbench + PHPUnit).
        Unit tests must not hit the network; only tests/Integration may call the real API.
    - path: "example-app/**"
      instructions: >-
        This is sample code customers copy. Prioritise correctness, security (no secrets, API key via
        env only, validate request input before rendering, safe Content-Disposition filenames),
        idiomatic Laravel usage, and that it matches what the README documents.
    - path: "README.md"
      instructions: >-
        Code samples, env var names, command options and requirements (PHP and Laravel versions) must
        match composer.json, config/poli-page.php and the actual Artisan command signature.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns: []      # per repo
