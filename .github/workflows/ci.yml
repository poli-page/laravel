name: CI
on:
  # Branches only: a tag push runs this workflow through release.yml instead.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this whole workflow as the gate before the Packagist
  # publish, so a release can never be approved on a commit CI would reject.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # `id-token: write` is needed by the Codecov upload step (OIDC auth).
    # `contents: read` re-stated because declaring permissions at the job
    # level replaces, and does not merge with, the defaults. release.yml
    # calls this workflow, so its `test` job grants the same two.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # Coverage axis merged onto the existing (8.5, 13.*) cell: when every
          # axis of an `include` entry matches an existing matrix cell, the
          # extra key (`coverage`) is added rather than spawning a new job.
          # PCOV over Xdebug: ~10x faster, no debugger baggage. The newest
          # PHP and Laravel, as the example app builds on that cell too.
          - php: '8.5'
            laravel: '13.*'
            coverage: pcov
    steps:
      - uses: actions/checkout@v7
        with: { path: laravel }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage || 'none' }}
      - name: Pin Laravel + Testbench
        working-directory: laravel
        run: composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - name: Install
        working-directory: laravel
        run: composer update --prefer-dist --no-progress
      - name: Lint
        working-directory: laravel
        run: vendor/bin/pint --test
      - name: Static analysis
        working-directory: laravel
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: API contract
        id: contract
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0
      - name: Unit tests
        working-directory: laravel
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          if [ -n "${{ matrix.coverage }}" ]; then
            vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage.xml
          else
            vendor/bin/phpunit --testsuite=unit
          fi
      # Upload only on the single matrix entry that produced coverage.xml.
      # `fail_ci_if_error: false` keeps a Codecov outage from breaking CI:
      # coverage is informational; the suite has already passed by here.
      # `use_oidc: true` authenticates via the GitHub-issued OIDC token
      # instead of a long-lived upload token. Public-repo tokenless uploads
      # are rejected on the default branch ("Token required because branch
      # is protected"), and OIDC avoids both the secret-rotation overhead
      # and that rejection.
      - name: Upload coverage to Codecov
        if: matrix.coverage != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: laravel/coverage.xml
          fail_ci_if_error: false
          use_oidc: true
          slug: poli-page/laravel
      - name: Contract tests
        working-directory: laravel
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: vendor/bin/phpunit --testsuite=contract
      - name: Build the example app
        if: matrix.laravel == '13.*'
        working-directory: laravel/example-app
        env:
          # route:list builds the controllers, which need a client; nothing is sent.
          POLI_PAGE_API_KEY: pp_sandbox_0123456789abcdef0123456789abcdef
        run: |
          composer update --prefer-dist --no-progress
          php artisan route:list --path=errors

  integration:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          case "$POLI_PAGE_API_KEY" in
            pp_sandbox_*) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::POLI_PAGE_API_KEY is not set or is not a pp_sandbox_ key: skipping the live API test."
              echo "present=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with: { path: laravel }
      - uses: shivammathur/setup-php@v2
        if: steps.key.outputs.present == 'true'
        with: { php-version: '8.3' }
      - name: Install
        if: steps.key.outputs.present == 'true'
        working-directory: laravel
        run: |
          if [ -f composer.json ]; then
            composer update --prefer-dist --no-progress
          fi
      - name: Live API test (sandbox key)
        if: steps.key.outputs.present == 'true'
        working-directory: laravel
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
        run: |
          # An unset secret expands to an empty string; drop it so the SDK
          # falls back to its default base URL.
          if [ -z "$POLI_PAGE_BASE_URL" ]; then unset POLI_PAGE_BASE_URL; fi
          if [ -d tests/Integration ] && [ -n "$(ls -A tests/Integration 2>/dev/null)" ]; then
            vendor/bin/phpunit --testsuite=integration
          else
            echo "Skipping integration tests: no tests/Integration yet"
          fi
