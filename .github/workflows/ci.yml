name: CI
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
    steps:
      - uses: actions/checkout@v4
        with: { path: laravel }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Pin Laravel + Testbench
        working-directory: laravel
        run: |
          if [ -f composer.json ]; then
            composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          fi
      - name: Install
        working-directory: laravel
        run: |
          if [ -f composer.json ]; then
            composer update --prefer-dist --no-progress
          else
            echo "Skipping install: no composer.json yet"
          fi
      - name: Lint
        working-directory: laravel
        run: |
          if [ -f pint.json ]; then
            vendor/bin/pint --test
          else
            echo "Skipping lint: no pint.json yet"
          fi
      - name: Static analysis
        working-directory: laravel
        run: |
          if [ -f phpstan.neon ]; then
            vendor/bin/phpstan analyse --memory-limit=512M
          else
            echo "Skipping phpstan: no phpstan.neon yet"
          fi
      - name: Unit tests
        working-directory: laravel
        run: |
          if [ -d tests/Unit ] && [ -n "$(ls -A tests/Unit 2>/dev/null)" ]; then
            vendor/bin/phpunit --testsuite=unit
          else
            echo "Skipping tests: no tests/Unit yet"
          fi

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with: { path: laravel }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - name: Install
        working-directory: laravel
        run: |
          if [ -f composer.json ]; then
            composer update --prefer-dist --no-progress
          fi
      - name: Integration test against develop API
        working-directory: laravel
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_DEVELOP_API_KEY }}
        run: |
          if [ -d tests/Integration ] && [ -n "$(ls -A tests/Integration 2>/dev/null)" ]; then
            vendor/bin/phpunit --testsuite=integration
          else
            echo "Skipping integration tests: no tests/Integration yet"
          fi
